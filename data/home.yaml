sections: [hero, timeline, cards, faq, cta]

hero:
  align: center
  eyebrow: prototype
  title_lines:
    - words: [{ text: The CAI Field Manual. }]
    - words: [{ text: Where the work happens. }]
  lead: A working skeleton for the field-manual example site — playbooks, procedures, and reference material that survives field conditions.
  actions:
    - { label: Open the "hello world" of field manuals, url: field-manual/, icon: fa-solid fa-map, style: primary }

cards:
  eyebrow: Structure
  title: What lives here
  columns: 2
  items:
    - title: What is a Field Manual?
      desc: "The desert-island definition — what a CAI Field Manual is, what it is not, and where it came from."
      icon: fa-solid fa-book-open
      url: what-is-a-field-manual/
    - title: Field Manual
      desc: Chronological manuals — set up, operate, the things that broke — filtered by the selector (RHAIE version, ops mode) at the top of every manual.
      icon: fa-solid fa-map
      url: field-manual/
    - title: Hello World Field Manual
      desc: "The blank field-manual skeleton: duplicate it and fill in your own field procedures."
      icon: fa-solid fa-seedling
      url: field-manual/hello-world/
    - title: Why this approach
      desc: "What the prototype copies from the MaaS guide, changes on purpose, and why — for the team walkthrough."
      icon: fa-solid fa-lightbulb
      url: why-this-approach/
    - title: Writing the field manual
      desc: "The doctrine for authors — the six conventions behind every manual here, annotated examples, and the walkthrough for a first manual."
      icon: fa-solid fa-pen-ruler
      url: writing-the-field-manual/
    - title: Contribute
      desc: "Edit manuals under content/field-manual/ and the landing copy in data/home.yaml; the dev server hot-reloads."
      icon: fa-solid fa-pen-nib
      url: writing-the-field-manual/write-a-manual/
    - title: Potential improvements
      desc: "What the field manual does not use yet — oink 1.4.0 capabilities left on the table, each illustrated on the page."
      icon: fa-solid fa-arrow-up-right-dots
      url: potential-improvements/

cta:
  title: "We want your feedback."
  text: "Report issues here"
  label: Github Issues
  url: https://github.com/rh-aiservices-bu/CAI-Field-Manual-prototype/issues
  style: primary

timeline:
  eyebrow: The format
  title: Every manual walks the field-work timeline
  items:
    - date: Phase 1
      icon: fa-solid fa-play
      title: Set up
      desc: One procedure that changes the system — prerequisites, status-gated commands, verification, rollback.
    - date: Phase 2
      icon: fa-solid fa-gauge-high
      title: Operate
      desc: Day-two health checks, drift detection, and when to escalate.
    - date: Phase 3
      icon: fa-solid fa-triangle-exclamation
      title: Things that broke
      desc: Known issues where you hit them — symptom, diagnosis, workaround, tracker id.

faq:
  eyebrow: For readers
  title: Questions people actually ask
  items:
    - question: Why does every command show its expected output?
      answer: A command whose output nobody checks is a guess about the system's state. The status gate turns "ran it" into "confirmed it" — see [Conventions](writing-the-field-manual/conventions/).
    - question: Why do versions and ops modes live in a selector instead of separate pages?
      answer: Divergence is permanent; separate pages fork the manual and drift apart. The selector filters, the choice persists, and the markdown output carries every variant labeled for agents.
