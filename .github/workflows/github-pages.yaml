name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * *" # daily 05:30 UTC: re-verify main even when quiet
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  GO_VERSION: 1.27.3
  HUGO_VERSION: "0.168.0"
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  build:
    name: Build Pages artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Record build tool versions
        run: |
          go version
          hugo version

      - name: Download OINK
        run: go mod download github.com/pgsty/oink

      # Same gate as PRs and the AGENTS.md gate: fail on build errors or any
      # WARN besides the known oink libsass deprecation.
      - name: Publication gate (build Pages artifact)
        run: scripts/publication-gate.sh --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
  pr-gate:
    name: PR publication gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Record build tool versions
        run: |
          go version
          hugo version

      - name: Download OINK
        run: go mod download github.com/pgsty/oink

      # Same gate as the deploy build and the AGENTS.md gate: fail on build
      # errors or any WARN besides the known oink libsass deprecation.
      - name: Publication gate
        run: scripts/publication-gate.sh

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
